<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Point Estimator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple icon components
        const PlusIcon = () => (
            <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
        );

        const TrashIcon = () => (
            <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const EditIcon = () => (
            <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        );

        const TargetIcon = () => (
            <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const BarChartIcon = () => (
            <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );

        const UserIcon = () => (
            <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        );

        const LogoutIcon = () => (
            <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        );

        const UsersIcon = () => (
            <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
            </svg>
        );

        const DashboardIcon = () => (
            <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [loginName, setLoginName] = useState('');
            const [loginRole, setLoginRole] = useState('');
            const [sessionId, setSessionId] = useState('');
            const [currentSession, setCurrentSession] = useState(null);
            const [showDashboard, setShowDashboard] = useState(false);
            const [stories, setStories] = useState([]);
            const [newStoryNumber, setNewStoryNumber] = useState('');
            const [newStorySummary, setNewStorySummary] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editingNumber, setEditingNumber] = useState('');
            const [editingSummary, setEditingSummary] = useState('');
            const [showDevReason, setShowDevReason] = useState(null);
            const [selectedDevReason, setSelectedDevReason] = useState('');
            const [showQaReason, setShowQaReason] = useState(null);
            const [selectedQaReason, setSelectedQaReason] = useState('');
            const [tempPoints, setTempPoints] = useState(null);
            const [showCreateSessionForm, setShowCreateSessionForm] = useState(false);
            const [teamName, setTeamName] = useState('');
            const [sprintValue, setSprintValue] = useState('');
            const [devOnlyStory, setDevOnlyStory] = useState(false);
            const [qaOnlyStory, setQaOnlyStory] = useState(false);

            // Fibonacci sequence for story points (limited to 13)
            const fibonacciPoints = [0, 0.5, 1, 2, 3, 5, 8, 13];

            // Developer estimation reasons
            const devEstimationReasons = [
                'Dev analysis is more',
                'Development is more',
                'Dev scenarios to be covered are more',
                'Unit testing will be more'
            ];

            // QA estimation reasons
            const qaEstimationReasons = [
                'QA Analysis will take more time',
                'Test cases/ scenarios are more',
                'Testing would take more time',
                'Documentation will take more time'
            ];

            const handleRoleEstimation = (storyId, points) => {
                if (user.role === 'Dev' && points > 0) {
                    setShowDevReason(storyId);
                    setSelectedDevReason('');
                    setTempPoints(points);
                } else if (user.role === 'QA' && points > 0) {
                    setShowQaReason(storyId);
                    setSelectedQaReason('');
                    setTempPoints(points);
                } else {
                    updateStoryPoints(storyId, points);
                }
            };

            const confirmDevEstimation = (storyId) => {
                updateStoryPoints(storyId, tempPoints, selectedDevReason);
                setShowDevReason(null);
                setSelectedDevReason('');
                setTempPoints(null);
            };

            const confirmQaEstimation = (storyId) => {
                updateStoryPoints(storyId, tempPoints, selectedQaReason);
                setShowQaReason(null);
                setSelectedQaReason('');
                setTempPoints(null);
            };

            const cancelDevEstimation = () => {
                setShowDevReason(null);
                setSelectedDevReason('');
                setTempPoints(null);
            };

            const cancelQaEstimation = () => {
                setShowQaReason(null);
                setSelectedQaReason('');
                setTempPoints(null);
            };

            // Session management functions (defined first)
            const generateSessionId = () => {
                return 'session_' + Math.random().toString(36).substr(2, 9);
            };

            // API Configuration
            const API_BASE = window.location.origin + '/api';

            // API Helper functions
            const api = {
                async getSession(sessionId) {
                    try {
                        const response = await fetch(`${API_BASE}/sessions/${sessionId}`);
                        if (response.ok) {
                            return await response.json();
                        }
                        return null;
                    } catch (error) {
                        console.error('Error fetching session:', error);
                        return null;
                    }
                },

                async createSession(sessionId, sessionData) {
                    try {
                        const response = await fetch(`${API_BASE}/sessions`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ sessionId, sessionData }),
                        });
                        if (response.ok) {
                            return await response.json();
                        }
                        throw new Error('Failed to create session');
                    } catch (error) {
                        console.error('Error creating session:', error);
                        throw error;
                    }
                },

                async updateSession(sessionId, sessionData) {
                    try {
                        const response = await fetch(`${API_BASE}/sessions/${sessionId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ sessionData }),
                        });
                        if (response.ok) {
                            return await response.json();
                        }
                        throw new Error('Failed to update session');
                    } catch (error) {
                        console.error('Error updating session:', error);
                        throw error;
                    }
                },

                async addParticipant(sessionId, participant) {
                    try {
                        const response = await fetch(`${API_BASE}/sessions/${sessionId}/participants`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ participant }),
                        });
                        if (response.ok) {
                            return await response.json();
                        }
                        throw new Error('Failed to add participant');
                    } catch (error) {
                        console.error('Error adding participant:', error);
                        throw error;
                    }
                }
            };

            const saveSession = async (id, sessionData) => {
                try {
                    await api.updateSession(id, sessionData);
                } catch (error) {
                    console.error('Failed to save session:', error);
                }
            };

            const getSession = async (id) => {
                try {
                    const session = await api.getSession(id);
                    return session;
                } catch (error) {
                    console.error('Failed to load session:', error);
                    return null;
                }
            };

            // Load user and session data from localStorage on component mount
            useEffect(() => {
                const savedUser = localStorage.getItem('storyPointEstimatorUser');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
                
                // Check for session ID in URL parameters first
                const urlParams = new URLSearchParams(window.location.search);
                const urlSessionId = urlParams.get('session');
                
                if (urlSessionId) {
                    setSessionId(urlSessionId);
                } else {
                    // Fall back to saved session ID
                    const savedSessionId = localStorage.getItem('storyPointEstimatorSessionId');
                    if (savedSessionId) {
                        setSessionId(savedSessionId);
                    }
                }
            }, []);

            // Load session when user or sessionId changes
            useEffect(() => {
                const loadSessionData = async () => {
                    if (!user || !sessionId) return;
                    
                    try {
                        let session = await getSession(sessionId);
                        
                        if (session) {
                            // Check if session is closed
                            if (session.status === 'closed') {
                                alert(`This session has been closed by ${session.closedBy}. You will be logged out.`);
                                setUser(null);
                                setCurrentSession(null);
                                setSessionId('');
                                setStories([]);
                                localStorage.removeItem('storyPointEstimatorSessionId');
                                localStorage.removeItem('storyPointEstimatorUser');
                                return;
                            }
                            
                            // Add user to participants if not already there
                            const existingUser = session.participants.find(p => p.name === user.name && p.role === user.role);
                            if (!existingUser) {
                                await api.addParticipant(sessionId, user);
                                session = await getSession(sessionId); // Reload session
                            }
                            setCurrentSession(session);
                            setStories(session.stories || []);
                            localStorage.setItem('storyPointEstimatorSessionId', sessionId);
                        } else {
                            // Session doesn't exist - create it automatically
                            console.log(`Creating new session: ${sessionId}`);
                            const newSession = {
                                id: sessionId,
                                createdBy: user.name,
                                createdAt: new Date().toISOString(),
                                participants: [{ ...user, joinedAt: new Date().toISOString() }],
                                stories: [],
                                estimations: {},
                                completedStories: {},
                                minimumActiveUntil: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
                                teamName: 'Team',
                                sprintValue: 'Current Sprint',
                                status: 'active'
                            };
                            await api.createSession(sessionId, newSession);
                            setCurrentSession(newSession);
                            setStories([]);
                            localStorage.setItem('storyPointEstimatorSessionId', sessionId);
                        }
                    } catch (error) {
                        console.error('Error loading session:', error);
                        alert('Failed to load session data. Please try again.');
                    }
                };

                loadSessionData();
            }, [user, sessionId]);

            // Save session data whenever stories change
            useEffect(() => {
                const updateSession = async () => {
                    if (currentSession && sessionId && stories) {
                        const updatedSession = {
                            ...currentSession,
                            stories: stories,
                            lastUpdated: new Date().toISOString()
                        };
                        setCurrentSession(updatedSession);
                        await saveSession(sessionId, updatedSession);
                    }
                };
                updateSession();
            }, [stories]);

            // Save user to localStorage whenever user changes
            useEffect(() => {
                if (user) {
                    localStorage.setItem('storyPointEstimatorUser', JSON.stringify(user));
                }
            }, [user]);

            // Auto-refresh session data every 5 seconds
            useEffect(() => {
                if (!sessionId || !user) return;

                const interval = setInterval(async () => {
                    try {
                        const session = await getSession(sessionId);
                        if (session) {
                            setCurrentSession(session);
                            setStories(session.stories || []);
                        }
                    } catch (error) {
                        console.error('Auto-refresh failed:', error);
                    }
                }, 5000);

                return () => clearInterval(interval);
            }, [sessionId, user]);

            const extractTicketId = (input) => {
                // Check if it's a URL
                if (input.startsWith('http')) {
                    // Extract ticket ID from URL like https://jira.carelonrx.com/browse/VPIE-40444
                    const match = input.match(/\/browse\/([A-Z]+-\d+)/i);
                    return match ? match[1] : input;
                }
                return input;
            };

            const addStory = () => {
                if (newStoryNumber.trim() === '' || newStorySummary.trim() === '') return;
                
                const storyNumberInput = newStoryNumber.trim();
                const ticketId = extractTicketId(storyNumberInput);
                
                const newStory = {
                    id: Date.now(),
                    number: ticketId,
                    numberUrl: storyNumberInput.startsWith('http') ? storyNumberInput : null,
                    summary: newStorySummary.trim(),
                    points: null,
                    createdAt: new Date().toISOString(),
                    restrictions: {
                        devOnly: devOnlyStory,
                        qaOnly: qaOnlyStory
                    }
                };
                
                setStories([...stories, newStory]);
                setNewStoryNumber('');
                setNewStorySummary('');
                setDevOnlyStory(false);
                setQaOnlyStory(false);
            };

            const removeStory = (id) => {
                setStories(stories.filter(story => story.id !== id));
            };

            // Get current user's estimation for a story
            const getUserEstimation = (storyId) => {
                if (!currentSession || !currentSession.estimations || !currentSession.estimations[storyId]) {
                    return null;
                }
                const userKey = `${user.name}_${user.role}`;
                const estimation = currentSession.estimations[storyId][userKey];
                return estimation ? (typeof estimation === 'object' ? estimation.points : estimation) : null;
            };

            const updateStoryPoints = (id, points, reason = null) => {
                // Only track estimation by user, don't update shared story points
                // Track estimation by user
                if (currentSession) {
                    const updatedEstimations = { ...currentSession.estimations };
                    if (!updatedEstimations[id]) {
                        updatedEstimations[id] = {};
                    }
                    
                    const estimationData = {
                        points: points,
                        timestamp: new Date().toISOString()
                    };
                    
                    // Add role-specific reason if provided
                    if (user.role === 'Dev' && reason) {
                        estimationData.devReason = reason;
                    } else if (user.role === 'QA' && reason) {
                        estimationData.qaReason = reason;
                    }
                    
                    updatedEstimations[id][`${user.name}_${user.role}`] = estimationData;
                    
                    const updatedSession = {
                        ...currentSession,
                        estimations: updatedEstimations
                    };
                    setCurrentSession(updatedSession);
                    saveSession(sessionId, updatedSession);
                }
            };

            const markStoryComplete = (storyId) => {
                if (user.role !== 'PO') {
                    alert('Only Product Owners can mark stories as complete.');
                    return;
                }
                
                if (currentSession) {
                    const updatedSession = {
                        ...currentSession,
                        completedStories: {
                            ...currentSession.completedStories,
                            [storyId]: {
                                completedBy: user.name,
                                completedAt: new Date().toISOString()
                            }
                        }
                    };
                    setCurrentSession(updatedSession);
                    saveSession(sessionId, updatedSession);
                }
            };

            const markStoryIncomplete = (storyId) => {
                if (user.role !== 'PO') {
                    alert('Only Product Owners can modify story completion status.');
                    return;
                }
                
                if (currentSession && currentSession.completedStories) {
                    const updatedCompletedStories = { ...currentSession.completedStories };
                    delete updatedCompletedStories[storyId];
                    
                    const updatedSession = {
                        ...currentSession,
                        completedStories: updatedCompletedStories
                    };
                    setCurrentSession(updatedSession);
                    saveSession(sessionId, updatedSession);
                }
            };

            const getStoryEstimationSummary = (storyId) => {
                if (!currentSession) return { estimated: [], notEstimated: [] };
                
                // Get story restrictions
                const story = stories.find(s => s.id === storyId);
                const restrictions = story?.restrictions;
                
                const storyEstimations = currentSession.estimations[storyId] || {};
                const estimatedUsers = Object.keys(storyEstimations);
                
                // Filter users based on story restrictions
                let eligibleUsers = currentSession.participants.map(p => `${p.name}_${p.role}`);
                if (restrictions) {
                    if (restrictions.devOnly) {
                        eligibleUsers = eligibleUsers.filter(userId => userId.endsWith('_Dev'));
                    } else if (restrictions.qaOnly) {
                        eligibleUsers = eligibleUsers.filter(userId => userId.endsWith('_QA'));
                    }
                }
                
                const notEstimatedUsers = eligibleUsers.filter(userId => !estimatedUsers.includes(userId));
                
                return {
                    estimated: estimatedUsers.map(userId => {
                        const [name, role] = userId.split('_');
                        const estimationData = storyEstimations[userId];
                        
                        return { 
                            userId, 
                            name, 
                            role, 
                            points: typeof estimationData === 'object' ? estimationData.points : estimationData,
                            devReason: typeof estimationData === 'object' ? estimationData.devReason : null,
                            qaReason: typeof estimationData === 'object' ? estimationData.qaReason : null,
                            timestamp: typeof estimationData === 'object' ? estimationData.timestamp : null
                        };
                    }),
                    notEstimated: notEstimatedUsers.map(userId => {
                        const [name, role] = userId.split('_');
                        return { userId, name, role };
                    })
                };
            };

            const getStoryAverageEstimation = (storyId) => {
                if (!currentSession) return 0;
                
                const storyEstimations = currentSession.estimations[storyId] || {};
                const estimates = Object.values(storyEstimations)
                    .map(est => typeof est === 'object' ? est.points : est)
                    .filter(points => points !== null && points !== undefined);
                
                if (estimates.length === 0) return 0;
                
                const sum = estimates.reduce((acc, points) => acc + points, 0);
                return Math.round((sum / estimates.length) * 10) / 10; // Round to 1 decimal place
            };

            const getRoleSpecificAverage = (storyId, role) => {
                if (!currentSession) return 0;
                
                const storyEstimations = currentSession.estimations[storyId] || {};
                const roleEstimates = Object.entries(storyEstimations)
                    .filter(([userId, _]) => userId.endsWith(`_${role}`))
                    .map(([_, est]) => typeof est === 'object' ? est.points : est)
                    .filter(points => points !== null && points !== undefined);
                
                if (roleEstimates.length === 0) return 0;
                
                const sum = roleEstimates.reduce((acc, points) => acc + points, 0);
                return Math.round((sum / roleEstimates.length) * 10) / 10; // Round to 1 decimal place
            };

            const downloadEstimationSummary = () => {
                if (!currentSession || stories.length === 0) {
                    alert('No stories available to export.');
                    return;
                }

                // Prepare data for CSV
                const csvData = [];
                csvData.push(['Story Number', 'Story Summary', 'Developer Average', 'QA Average', 'Overall Average', 'Total Estimations']);

                stories.forEach(story => {
                    const devAverage = getRoleSpecificAverage(story.id, 'Dev');
                    const qaAverage = getRoleSpecificAverage(story.id, 'QA');
                    const overallAverage = getStoryAverageEstimation(story.id);
                    
                    const storyEstimations = currentSession.estimations[story.id] || {};
                    const totalEstimations = Object.keys(storyEstimations).length;
                    
                    csvData.push([
                        story.number || 'N/A',
                        story.summary || story.title || 'No summary',
                        devAverage > 0 ? devAverage : 'N/A',
                        qaAverage > 0 ? qaAverage : 'N/A', 
                        overallAverage > 0 ? overallAverage : 'N/A',
                        totalEstimations
                    ]);
                });

                // Convert to CSV format
                const csvContent = csvData.map(row => 
                    row.map(cell => {
                        // Escape quotes and wrap in quotes if contains comma
                        const cellStr = String(cell);
                        if (cellStr.includes(',') || cellStr.includes('"') || cellStr.includes('\n')) {
                            return `"${cellStr.replace(/"/g, '""')}"`;
                        }
                        return cellStr;
                    }).join(',')
                ).join('\n');

                // Create and trigger download
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                
                if (link.download !== undefined) {
                    const url = URL.createObjectURL(blob);
                    link.setAttribute('href', url);
                    
                    // Create filename with team name and sprint
                    const teamPart = currentSession.teamName ? `${currentSession.teamName}_` : '';
                    const sprintPart = currentSession.sprintValue ? `${currentSession.sprintValue}_` : '';
                    const datePart = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
                    
                    link.setAttribute('download', `${teamPart}${sprintPart}Estimation_Summary_${datePart}.csv`);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            };

            const startEditing = (story) => {
                setEditingId(story.id);
                setEditingNumber(story.numberUrl || story.number || '');
                setEditingSummary(story.summary || story.title || '');
            };

            const saveEdit = () => {
                if (editingNumber.trim() === '' || editingSummary.trim() === '') return;
                
                const storyNumberInput = editingNumber.trim();
                const ticketId = extractTicketId(storyNumberInput);
                
                setStories(stories.map(story =>
                    story.id === editingId ? { 
                        ...story, 
                        number: ticketId,
                        numberUrl: storyNumberInput.startsWith('http') ? storyNumberInput : (story.numberUrl || null),
                        summary: editingSummary.trim()
                    } : story
                ));
                
                setEditingId(null);
                setEditingNumber('');
                setEditingSummary('');
            };

            const cancelEdit = () => {
                setEditingId(null);
                setEditingNumber('');
                setEditingSummary('');
            };

            const handleLogin = () => {
                if (loginName.trim() === '' || loginRole === '') return;
                
                const userData = {
                    name: loginName.trim(),
                    role: loginRole,
                    loginTime: new Date().toISOString()
                };
                
                setUser(userData);
                setLoginName('');
                setLoginRole('');
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('storyPointEstimatorUser');
            };

            const getRoleColor = (role) => {
                const colors = {
                    'Dev': 'bg-blue-100 text-blue-800',
                    'QA': 'bg-green-100 text-green-800',
                    'PO': 'bg-purple-100 text-purple-800',
                    'SM': 'bg-orange-100 text-orange-800'
                };
                return colors[role] || 'bg-gray-100 text-gray-800';
            };

            const createSession = () => {
                if (teamName.trim() === '' || sprintValue.trim() === '') {
                    alert('Please enter both team name and sprint value.');
                    return;
                }
                
                const newSessionId = generateSessionId();
                const createdAt = new Date().toISOString();
                const newSession = {
                    id: newSessionId,
                    participants: [{ name: user.name, role: user.role }],
                    stories: [],
                    estimations: {},
                    completedStories: {},
                    createdBy: user.name,
                    createdAt: createdAt,
                    minimumActiveUntil: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(), // 2 hours from now
                    teamName: teamName.trim(),
                    sprintValue: sprintValue.trim(),
                    status: 'active'
                };
                
                saveSession(newSessionId, newSession);
                setSessionId(newSessionId);
                setCurrentSession(newSession);
                localStorage.setItem('storyPointEstimatorSessionId', newSessionId);
                setShowCreateSessionForm(false);
                setTeamName('');
                setSprintValue('');
            };

            const joinSession = (id) => {
                const session = getSession(id);
                if (session) {
                    // Check if session is closed
                    if (session.status === 'closed') {
                        alert(`This session has been closed by ${session.closedBy} on ${new Date(session.closedAt).toLocaleString()}. Please create a new session or join a different one.`);
                        return;
                    }
                    
                    // Add user to participants if not already there
                    const existingUser = session.participants.find(p => p.name === user.name && p.role === user.role);
                    if (!existingUser) {
                        session.participants.push(user);
                        saveSession(id, session);
                    }
                    
                    setCurrentSession(session);
                    setSessionId(id);
                    setStories(session.stories || []);
                    localStorage.setItem('storyPointEstimatorSessionId', id);
                } else {
                    alert('Session not found!');
                }
            };

            const leaveSession = () => {
                setCurrentSession(null);
                setSessionId('');
                setStories([]);
                localStorage.removeItem('storyPointEstimatorSessionId');
            };

            const closeSession = () => {
                if (user.role !== 'PO') {
                    alert('Only Product Owners can close sessions.');
                    return;
                }

                if (confirm('Are you sure you want to close this session? This will end the session for all participants and they will be logged out.')) {
                    // Mark session as closed
                    const closedSession = {
                        ...currentSession,
                        status: 'closed',
                        closedBy: user.name,
                        closedAt: new Date().toISOString()
                    };
                    
                    saveSession(sessionId, closedSession);
                    
                    // Clear local state and logout
                    setCurrentSession(null);
                    setSessionId('');
                    setStories([]);
                    setUser(null);
                    localStorage.removeItem('storyPointEstimatorSessionId');
                    localStorage.removeItem('storyPointEstimatorUser');
                    
                    alert('Session has been closed successfully. All participants will be logged out.');
                }
            };

            const getSessionTimeInfo = () => {
                if (!currentSession || !currentSession.minimumActiveUntil) return null;
                
                // PO can always close sessions regardless of time restrictions
                if (user && user.role === 'PO') {
                    return { canClose: true, message: 'Session can be closed' };
                }
                
                const now = new Date();
                const minimumActiveUntil = new Date(currentSession.minimumActiveUntil);
                const canClose = now >= minimumActiveUntil;
                
                if (canClose) {
                    return { canClose: true, message: 'Session can be closed' };
                } else {
                    const remainingTime = Math.ceil((minimumActiveUntil - now) / (1000 * 60)); // Minutes remaining
                    const hours = Math.floor(remainingTime / 60);
                    const minutes = remainingTime % 60;
                    
                    let timeString = '';
                    if (hours > 0) {
                        timeString = `${hours}h ${minutes}m`;
                    } else {
                        timeString = `${minutes}m`;
                    }
                    
                    return { 
                        canClose: false, 
                        message: `Minimum 2h active period - ${timeString} remaining`,
                        remainingMinutes: remainingTime
                    };
                }
            };

            const totalPoints = stories
                .map(story => getUserEstimation(story.id))
                .filter(points => points !== null)
                .reduce((sum, points) => sum + points, 0);

            const estimatedStories = stories
                .map(story => getUserEstimation(story.id))
                .filter(points => points !== null).length;

            // Dashboard functions
            const getEstimationStatus = () => {
                if (!currentSession) return [];
                
                return stories.map(story => {
                    const storyEstimations = currentSession.estimations[story.id] || {};
                    const estimatedBy = Object.keys(storyEstimations);
                    const notEstimatedBy = currentSession.participants
                        .map(p => `${p.name}_${p.role}`)
                        .filter(userId => !estimatedBy.includes(userId));
                    
                    return {
                        story,
                        estimatedBy: estimatedBy.map(userId => {
                            const [name, role] = userId.split('_');
                            return { userId, name, role, points: storyEstimations[userId] };
                        }),
                        notEstimatedBy: notEstimatedBy.map(userId => {
                            const [name, role] = userId.split('_');
                            return { userId, name, role };
                        }),
                        isComplete: notEstimatedBy.length === 0
                    };
                });
            };

            const generateSummary = () => {
                const status = getEstimationStatus();
                const completeStories = status.filter(s => s.isComplete);
                
                return completeStories.map(storyStatus => {
                    const estimates = storyStatus.estimatedBy.map(e => e.points);
                    const average = estimates.reduce((a, b) => a + b, 0) / estimates.length;
                    const min = Math.min(...estimates);
                    const max = Math.max(...estimates);
                    
                    // Find most common estimate (mode)
                    const frequency = {};
                    estimates.forEach(est => frequency[est] = (frequency[est] || 0) + 1);
                    const mode = Object.keys(frequency).reduce((a, b) => frequency[a] > frequency[b] ? a : b);
                    
                    return {
                        story: storyStatus.story,
                        estimates: storyStatus.estimatedBy,
                        average: Math.round(average * 10) / 10,
                        min,
                        max,
                        mode: parseInt(mode),
                        consensus: min === max
                    };
                });
            };

            // Show session selection if user is logged in but no session
            if (user && !currentSession) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
                        <div className="max-w-md w-full space-y-8">
                            <div>
                                <div className="flex justify-center mb-6">
                                    <UsersIcon />
                                </div>
                                <h2 className="text-center text-3xl font-bold text-gray-900 mb-2">
                                    Join Estimation Session
                                </h2>
                                <p className="text-center text-gray-600">
                                    {sessionId ? 'Ready to join session!' : 
                                     user.role === 'PO' ? 'Create a new session or join an existing one' : 
                                     'Join an existing session using the session ID'}
                                </p>
                            </div>
                            <div className="bg-white p-8 rounded-lg shadow-sm border space-y-6">
                                <div className="space-y-4">
                                    {user.role === 'PO' && (
                                        <>
                                            {!showCreateSessionForm ? (
                                                <button
                                                    onClick={() => setShowCreateSessionForm(true)}
                                                    className="w-full px-4 py-3 bg-primary-600 text-white rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 font-medium"
                                                >
                                                    Create New Session
                                                </button>
                                            ) : (
                                                <div className="space-y-4 p-4 bg-gray-50 rounded-lg border">
                                                    <h3 className="font-medium text-gray-900">Create New Session</h3>
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                                            Team Name
                                                        </label>
                                                        <input
                                                            type="text"
                                                            value={teamName}
                                                            onChange={(e) => setTeamName(e.target.value)}
                                                            placeholder="Enter your team name"
                                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                                            Sprint Value
                                                        </label>
                                                        <input
                                                            type="text"
                                                            value={sprintValue}
                                                            onChange={(e) => setSprintValue(e.target.value)}
                                                            placeholder="Enter sprint value (e.g., Sprint 24, Q2 2026)"
                                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                        />
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={createSession}
                                                            disabled={!teamName.trim() || !sprintValue.trim()}
                                                            className="flex-1 px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 font-medium disabled:bg-gray-300 disabled:cursor-not-allowed"
                                                        >
                                                            Create Session
                                                        </button>
                                                        <button
                                                            onClick={() => {
                                                                setShowCreateSessionForm(false);
                                                                setTeamName('');
                                                                setSprintValue('');
                                                            }}
                                                            className="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 font-medium"
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="text-center text-gray-500">or</div>
                                        </>
                                    )}
                                    
                                    <div>
                                        <input
                                            type="text"
                                            value={sessionId}
                                            onChange={(e) => setSessionId(e.target.value)}
                                            placeholder="Enter session ID"
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent mb-3"
                                            onKeyPress={(e) => e.key === 'Enter' && sessionId.trim() && joinSession(sessionId)}
                                        />
                                        <button
                                            onClick={() => joinSession(sessionId)}
                                            disabled={!sessionId.trim()}
                                            className="w-full px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 font-medium disabled:bg-gray-300 disabled:cursor-not-allowed"
                                        >
                                            Join Session
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3 pt-4 border-t">
                                    <UserIcon />
                                    <div>
                                        <p className="font-medium text-gray-900">{user.name}</p>
                                        <span className={`px-2 py-1 rounded text-xs font-medium ${getRoleColor(user.role)}`}>
                                            {user.role === 'Dev' ? 'Developer' : 
                                             user.role === 'QA' ? 'Quality Assurance' :
                                             user.role === 'PO' ? 'Product Owner' :
                                             user.role === 'SM' ? 'Scrum Master' : user.role}
                                        </span>
                                    </div>
                                    <button
                                        onClick={handleLogout}
                                        className="ml-auto p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md"
                                        title="Sign Out"
                                    >
                                        <LogoutIcon />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Show login screen if user is not logged in
            if (!user) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
                        <div className="max-w-md w-full space-y-8">
                            <div>
                                <div className="flex justify-center mb-6">
                                    <TargetIcon />
                                </div>
                                <h2 className="text-center text-3xl font-bold text-gray-900 mb-2">
                                    Story Point Estimator
                                </h2>
                                <p className="text-center text-gray-600">
                                    Please sign in to access the estimation tool
                                </p>
                            </div>
                            <div className="bg-white p-8 rounded-lg shadow-sm border space-y-6">
                                <div>
                                    <label htmlFor="name" className="block text-sm font-medium text-gray-700 mb-2">
                                        Your Name
                                    </label>
                                    <input
                                        id="name"
                                        type="text"
                                        value={loginName}
                                        onChange={(e) => setLoginName(e.target.value)}
                                        placeholder="Enter your full name"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                    />
                                </div>
                                <div>
                                    <label htmlFor="role" className="block text-sm font-medium text-gray-700 mb-2">
                                        Select Your Role
                                    </label>
                                    <select
                                        id="role"
                                        value={loginRole}
                                        onChange={(e) => setLoginRole(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                    >
                                        <option value="">Choose your role...</option>
                                        <option value="Dev">Developer (Dev)</option>
                                        <option value="QA">Quality Assurance (QA)</option>
                                        <option value="PO">Product Owner (PO)</option>
                                        <option value="SM">Scrum Master (SM)</option>
                                    </select>
                                </div>
                                <button
                                    onClick={handleLogin}
                                    className="w-full px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 font-medium"
                                >
                                    Sign In
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <div className="flex justify-between items-start mb-8">
                            <div className="text-center flex-1">
                                <div className="flex items-center justify-center gap-3 mb-4">
                                    <TargetIcon />
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">
                                            Story Point Estimator
                                            <span className="text-sm font-normal text-green-600 ml-2">
                                                🚀 Server-Based (Team Sync)
                                            </span>
                                            {currentSession && currentSession.teamName && (
                                                <span className="text-xl text-primary-600 ml-3">
                                                    - {currentSession.teamName}
                                                </span>
                                            )}
                                        </h1>
                                        {currentSession && currentSession.sprintValue && (
                                            <div className="mt-1">
                                                <span className="bg-primary-100 text-primary-800 px-3 py-1 rounded-full text-sm font-medium">
                                                    {currentSession.sprintValue}
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right">
                                    <div className="flex items-center gap-2 mb-1">
                                        <UserIcon />
                                        <span className="font-medium text-gray-900">{user.name}</span>
                                    </div>
                                    <span className={`px-2 py-1 rounded text-xs font-medium ${getRoleColor(user.role)}`}>
                                        {user.role === 'Dev' ? 'Developer' : 
                                         user.role === 'QA' ? 'Quality Assurance' :
                                         user.role === 'PO' ? 'Product Owner' :
                                         user.role === 'SM' ? 'Scrum Master' : user.role}
                                    </span>
                                </div>
                                <button
                                    onClick={() => setShowDashboard(!showDashboard)}
                                    className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md mr-2"
                                    title="Toggle Dashboard"
                                >
                                    <DashboardIcon />
                                </button>
                                <button
                                    onClick={leaveSession}
                                    className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md mr-2"
                                    title="Leave Session"
                                >
                                    <UsersIcon />
                                </button>
                                {user.role === 'PO' && (() => {
                                    const timeInfo = getSessionTimeInfo();
                                    return (
                                        <div className="flex items-center gap-2">
                                            {timeInfo && !timeInfo.canClose && (
                                                <div className="text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded">
                                                    {timeInfo.message}
                                                </div>
                                            )}
                                            <button
                                                onClick={closeSession}
                                                disabled={timeInfo && !timeInfo.canClose}
                                                className={`p-2 rounded-md mr-2 ${
                                                    timeInfo && !timeInfo.canClose
                                                        ? 'text-gray-400 bg-gray-100 cursor-not-allowed'
                                                        : 'text-red-500 hover:text-red-700 hover:bg-red-50'
                                                }`}
                                                title={timeInfo && !timeInfo.canClose ? timeInfo.message : 'Close Session (PO Only)'}
                                            >
                                                <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                        </div>
                                    );
                                })()}
                                <button
                                    onClick={handleLogout}
                                    className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md"
                                    title="Sign Out"
                                >
                                    <LogoutIcon />
                                </button>
                            </div>
                        </div>

                        {/* Session Info */}
                        {currentSession && (
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-8">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <p className="text-sm font-medium text-blue-800">Session ID: {sessionId}</p>
                                            <button
                                                onClick={() => {
                                                    const shareUrl = `${window.location.origin}${window.location.pathname}?session=${sessionId}`;
                                                    navigator.clipboard.writeText(shareUrl);
                                                    alert('Share URL copied to clipboard!');
                                                }}
                                                className="px-2 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700"
                                                title="Copy share URL"
                                            >
                                                Copy Link
                                            </button>
                                        </div>
                                        <p className="text-xs text-blue-600">
                                            {currentSession.participants.length} participants
                                        </p>
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        {currentSession.participants.map((participant, idx) => (
                                            <span 
                                                key={idx}
                                                className={`px-2 py-1 rounded text-xs font-medium ${getRoleColor(participant.role)}`}
                                            >
                                                {participant.name} ({participant.role})
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dashboard */}
                        {showDashboard && currentSession && (
                            <div className="bg-white p-6 rounded-lg shadow-sm border mb-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-semibold text-gray-900">Estimation Dashboard</h2>
                                    <button
                                        onClick={downloadEstimationSummary}
                                        className="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 font-medium flex items-center gap-2"
                                        title="Download estimation summary as Excel file"
                                    >
                                        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                        Download Summary
                                    </button>
                                </div>
                                
                                {(() => {
                                    try {
                                        const estimationStatus = getEstimationStatus();
                                        
                                        if (!Array.isArray(estimationStatus) || estimationStatus.length === 0) {
                                            return (
                                                <div className="text-center py-8 text-gray-500">
                                                    <p>No stories available for dashboard display.</p>
                                                </div>
                                            );
                                        }

                                        return estimationStatus.map(storyStatus => (
                                            <div key={storyStatus.story.id} className="border-b border-gray-200 pb-4 mb-4 last:border-b-0 last:mb-0">
                                                <div className="flex items-center gap-3 mb-3">
                                                    <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm font-medium">
                                                        {storyStatus.story.number || 'N/A'}
                                                    </span>
                                                    <h3 className="font-medium text-gray-900 flex-1">{storyStatus.story.summary || storyStatus.story.title || 'No Title'}</h3>
                                                    {storyStatus.isComplete && (
                                                        <span className="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-medium">
                                                            Complete
                                                        </span>
                                                    )}
                                                </div>
                                                
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div>
                                                        <p className="text-sm font-medium text-gray-700 mb-2">Estimated by:</p>
                                                        <div className="space-y-1">
                                                            {storyStatus.estimatedBy && storyStatus.estimatedBy.length > 0 ? (
                                                                storyStatus.estimatedBy.map(est => (
                                                                    <div key={est.userId} className="flex items-center gap-2">
                                                                        <span className={`px-2 py-1 rounded text-xs ${getRoleColor(est.role)}`}>
                                                                            {est.name} ({est.role})
                                                                        </span>
                                                                        <span className="bg-gray-100 px-2 py-1 rounded text-xs font-mono">
                                                                            {est.points}
                                                                        </span>
                                                                    </div>
                                                                ))
                                                            ) : (
                                                                <p className="text-xs text-gray-500">No estimates yet</p>
                                                            )}
                                                        </div>
                                                    </div>
                                                    
                                                    <div>
                                                        <p className="text-sm font-medium text-gray-700 mb-2">Pending estimation:</p>
                                                        <div className="space-y-1">
                                                            {storyStatus.notEstimatedBy && storyStatus.notEstimatedBy.length > 0 ? (
                                                                storyStatus.notEstimatedBy.map(pending => (
                                                                    <div key={pending.userId} className="flex items-center gap-2">
                                                                        <span className={`px-2 py-1 rounded text-xs ${getRoleColor(pending.role)} opacity-50`}>
                                                                            {pending.name} ({pending.role})
                                                                        </span>
                                                                        <span className="text-xs text-gray-500">Waiting...</span>
                                                                    </div>
                                                                ))
                                                            ) : (
                                                                <p className="text-xs text-green-600">All estimated!</p>
                                                            )}
                                                        </div>
                                                    </div>
                                                    
                                                    <div>
                                                        <p className="text-sm font-medium text-gray-700 mb-2">Averages:</p>
                                                        <div className="space-y-1">
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-xs text-blue-600">Dev:</span>
                                                                <span className="bg-blue-100 px-2 py-1 rounded text-xs font-mono">
                                                                    {getRoleSpecificAverage(storyStatus.story.id, 'Dev') || 'N/A'}
                                                                </span>
                                                            </div>
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-xs text-green-600">QA:</span>
                                                                <span className="bg-green-100 px-2 py-1 rounded text-xs font-mono">
                                                                    {getRoleSpecificAverage(storyStatus.story.id, 'QA') || 'N/A'}
                                                                </span>
                                                            </div>
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-xs text-gray-600">Overall:</span>
                                                                <span className="bg-gray-100 px-2 py-1 rounded text-xs font-mono font-bold">
                                                                    {getStoryAverageEstimation(storyStatus.story.id) || 'N/A'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ));
                                    } catch (error) {
                                        console.error('Dashboard error:', error);
                                        return (
                                            <div className="text-center py-8 text-red-500">
                                                <p>Error loading dashboard. Please try again.</p>
                                                <button 
                                                    onClick={() => setShowDashboard(false)}
                                                    className="mt-2 px-4 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200"
                                                >
                                                    Close Dashboard
                                                </button>
                                            </div>
                                        );
                                    }
                                })()}
                            </div>
                        )}

                        {/* Summary Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-lg shadow-sm border">
                                <div className="flex items-center gap-3">
                                    <BarChartIcon />
                                    <div>
                                        <p className="text-sm text-gray-600">Total Points</p>
                                        <p className="text-2xl font-bold text-blue-600">{totalPoints}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white p-6 rounded-lg shadow-sm border">
                                <div className="flex items-center gap-3">
                                    <TargetIcon />
                                    <div>
                                        <p className="text-sm text-gray-600">Estimated Stories</p>
                                        <p className="text-2xl font-bold text-green-600">{estimatedStories}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white p-6 rounded-lg shadow-sm border">
                                <div className="flex items-center gap-3">
                                    <EditIcon />
                                    <div>
                                        <p className="text-sm text-gray-600">Total Stories</p>
                                        <p className="text-2xl font-bold text-purple-600">{stories.length}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Add New Story */}
                        <div className="bg-white p-6 rounded-lg shadow-sm border mb-8">
                            <h2 className="text-lg font-semibold text-gray-900 mb-4">Add New Story</h2>
                            <div className="space-y-3">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                    <input
                                        type="text"
                                        value={newStoryNumber}
                                        onChange={(e) => setNewStoryNumber(e.target.value)}
                                        placeholder="Story number or URL (e.g., VPIE-40444 or https://jira.carelonrx.com/browse/VPIE-40444)"
                                        className="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                        onKeyPress={(e) => e.key === 'Enter' && addStory()}
                                    />
                                    <input
                                        type="text"
                                        value={newStorySummary}
                                        onChange={(e) => setNewStorySummary(e.target.value)}
                                        placeholder="Story summary..."
                                        className="md:col-span-2 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                        onKeyPress={(e) => e.key === 'Enter' && addStory()}
                                    />
                                    <button
                                        onClick={addStory}
                                        className="px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 flex items-center justify-center gap-2"
                                    >
                                        <PlusIcon />
                                        Add Story
                                    </button>
                                </div>
                                
                                {/* PO-only role restriction toggles */}
                                {user.role === 'PO' && (
                                    <div className="p-4 bg-purple-50 border border-purple-200 rounded-lg">
                                        <p className="text-sm font-medium text-purple-900 mb-3">Estimation Restrictions (Optional)</p>
                                        <div className="flex gap-6">
                                            <label className="flex items-center cursor-pointer">
                                                <div className="relative">
                                                    <input
                                                        type="checkbox"
                                                        checked={devOnlyStory}
                                                        onChange={(e) => {
