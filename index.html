                                                            setDevOnlyStory(e.target.checked);
                                                            if (e.target.checked) setQaOnlyStory(false);
                                                        }}
                                                        className="sr-only"
                                                    />
                                                    <div className={`w-8 h-4 rounded-full ${devOnlyStory ? 'bg-blue-500' : 'bg-gray-300'} transition-colors duration-200`}>
                                                        <div className={`w-3 h-3 bg-white rounded-full shadow transform transition-transform duration-200 mt-0.5 ${devOnlyStory ? 'translate-x-4' : 'translate-x-0.5'}`}></div>
                                                    </div>
                                                </div>
                                                <span className="ml-3 text-sm font-medium text-purple-700">Dev Only</span>
                                            </label>
                                            <label className="flex items-center cursor-pointer">
                                                <div className="relative">
                                                    <input
                                                        type="checkbox"
                                                        checked={qaOnlyStory}
                                                        onChange={(e) => {
                                                            setQaOnlyStory(e.target.checked);
                                                            if (e.target.checked) setDevOnlyStory(false);
                                                        }}
                                                        className="sr-only"
                                                    />
                                                    <div className={`w-8 h-4 rounded-full ${qaOnlyStory ? 'bg-green-500' : 'bg-gray-300'} transition-colors duration-200`}>
                                                        <div className={`w-3 h-3 bg-white rounded-full shadow transform transition-transform duration-200 mt-0.5 ${qaOnlyStory ? 'translate-x-4' : 'translate-x-0.5'}`}></div>
                                                    </div>
                                                </div>
                                                <span className="ml-3 text-sm font-medium text-purple-700">QA Only</span>
                                            </label>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Stories List */}
                        <div className="space-y-4">
                            {stories.length === 0 ? (
                                <div className="bg-white p-12 rounded-lg shadow-sm border text-center">
                                    <TargetIcon />
                                    <p className="text-gray-500 text-lg mt-4">No stories yet. Add your first story above!</p>
                                </div>
                            ) : (
                                <>
                                    {/* Active Stories (not completed) */}
                                    {stories.filter(story => !(currentSession && currentSession.completedStories && currentSession.completedStories[story.id])).map((story) => (
                                        <div key={story.id} className="bg-white p-6 rounded-lg shadow-sm border">
                                            <div className="flex items-start justify-between gap-4">
                                            <div className="flex-1">
                                                {editingId === story.id ? (
                                                    <div className="space-y-2">
                                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                                                            <input
                                                                type="text"
                                                                value={editingNumber}
                                                                onChange={(e) => setEditingNumber(e.target.value)}
                                                                placeholder="Story number or URL"
                                                                className="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                                onKeyPress={(e) => e.key === 'Enter' && saveEdit()}
                                                                autoFocus
                                                            />
                                                            <input
                                                                type="text"
                                                                value={editingSummary}
                                                                onChange={(e) => setEditingSummary(e.target.value)}
                                                                placeholder="Story summary"
                                                                className="md:col-span-2 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                                onKeyPress={(e) => e.key === 'Enter' && saveEdit()}
                                                            />
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button
                                                                onClick={saveEdit}
                                                                className="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm"
                                                            >
                                                                Save
                                                            </button>
                                                            <button
                                                                onClick={cancelEdit}
                                                                className="px-3 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 text-sm"
                                                            >
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-center gap-3">
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-3 mb-1">
                                                                {story.numberUrl ? (
                                                                    <a
                                                                        href={story.numberUrl}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm font-medium hover:bg-blue-200 hover:text-blue-900 transition-colors cursor-pointer"
                                                                        title={`Open ${story.numberUrl}`}
                                                                    >
                                                                        {story.number || 'N/A'}
                                                                        <svg className="inline-block ml-1 h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                                                        </svg>
                                                                    </a>
                                                                ) : (
                                                                    <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm font-medium">
                                                                        {story.number || story.title?.split(' ')[0] || 'N/A'}
                                                                    </span>
                                                                )}
                                                                {currentSession && currentSession.completedStories && currentSession.completedStories[story.id] && (
                                                                    <span className="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-medium">
                                                                        ✓ Complete
                                                                    </span>
                                                                )}
                                                                {story.restrictions && story.restrictions.devOnly && (
                                                                    <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-medium">
                                                                        👨‍💻 Dev Only
                                                                    </span>
                                                                )}
                                                                {story.restrictions && story.restrictions.qaOnly && (
                                                                    <span className="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-medium">
                                                                        🧪 QA Only
                                                                    </span>
                                                                )}
                                                                <button
                                                                    onClick={() => startEditing(story)}
                                                                    className="p-1 text-gray-400 hover:text-gray-600"
                                                                >
                                                                    <EditIcon />
                                                                </button>
                                                            </div>
                                                            <h3 className="text-lg font-medium text-gray-900">
                                                                {story.summary || story.title || 'No summary'}
                                                            </h3>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <button
                                                onClick={() => removeStory(story.id)}
                                                className="p-2 text-red-400 hover:text-red-600"
                                            >
                                                <TrashIcon />
                                            </button>
                                        </div>

                                        {/* Team Estimations Display (for PO) */}
                                        {user.role === 'PO' && currentSession && (
                                            <div className="mt-4 p-4 bg-purple-50 border border-purple-200 rounded-lg">
                                                <h4 className="font-medium text-purple-900 mb-3">Team Estimations</h4>
                                                {(() => {
                                                    const summary = getStoryEstimationSummary(story.id);
                                                    return (
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                            <div>
                                                                <p className="text-sm font-medium text-purple-700 mb-2">
                                                                    Provided ({summary.estimated.length})
                                                                </p>
                                                                <div className="space-y-2">
                                                                    {summary.estimated.map(est => (
                                                                        <div key={est.userId} className="bg-white p-3 rounded border">
                                                                            <div className="flex items-center justify-between mb-1">
                                                                                <span className={`px-2 py-1 rounded text-xs ${getRoleColor(est.role)}`}>
                                                                                    {est.name} ({est.role})
                                                                                </span>
                                                                                <span className="bg-purple-200 px-3 py-1 rounded font-bold text-purple-800">
                                                                                    {est.points}
                                                                                </span>
                                                                            </div>
                                                                            {est.devReason && est.role === 'Dev' && (
                                                                                <p className="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded mt-1">
                                                                                    💡 {est.devReason}
                                                                                </p>
                                                                            )}
                                                                            {est.qaReason && est.role === 'QA' && (
                                                                                <p className="text-xs text-green-600 bg-green-50 px-2 py-1 rounded mt-1">
                                                                                    🧪 {est.qaReason}
                                                                                </p>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                    {summary.estimated.length === 0 && (
                                                                        <p className="text-sm text-gray-500 italic">No team estimations yet</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            
                                                            <div>
                                                                <p className="text-sm font-medium text-purple-700 mb-2">
                                                                    Waiting ({summary.notEstimated.length})
                                                                </p>
                                                                <div className="space-y-1">
                                                                    {summary.notEstimated.map(pending => (
                                                                        <div key={pending.userId} className="bg-gray-100 p-2 rounded border-dashed border">
                                                                            <span className={`px-2 py-1 rounded text-xs ${getRoleColor(pending.role)} opacity-60`}>
                                                                                {pending.name} ({pending.role})
                                                                            </span>
                                                                            <span className="text-xs text-gray-500 ml-2">Pending...</span>
                                                                        </div>
                                                                    ))}
                                                                    {summary.notEstimated.length === 0 && (
                                                                        <p className="text-sm text-green-600 font-medium">✓ All team members estimated!</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}

                                        {/* Point Selection */}
                                        <div className="mt-4">
                                            <p className="text-sm text-gray-600 mb-3">Story Points:</p>
                                            <div className="flex flex-wrap gap-2">
                                                {fibonacciPoints.map((point) => (
                                                    <button
                                                        key={point}
                                                        onClick={() => handleRoleEstimation(story.id, point)}
                                                        className={`px-3 py-2 rounded-md border font-medium transition-colors ${
                                                            getUserEstimation(story.id) === point
                                                                ? 'bg-primary-600 text-white border-primary-600'
                                                                : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                                                        }`}
                                                    >
                                                        {point}
                                                    </button>
                                                ))}
                                                <button
                                                    onClick={() => handleRoleEstimation(story.id, null)}
                                                    className={`px-3 py-2 rounded-md border font-medium transition-colors ${
                                                        getUserEstimation(story.id) === null
                                                            ? 'bg-gray-600 text-white border-gray-600'
                                                            : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                                                    }`}
                                                >
                                                    ?
                                                </button>
                                            </div>

                                            {/* Current User's Estimation Feedback */}
                                            {getUserEstimation(story.id) !== null && (
                                                <div className="mt-3">
                                                    <p className="text-sm text-green-600 font-medium">
                                                        ✓ Your estimate: {getUserEstimation(story.id)} points
                                                    </p>
                                                </div>
                                            )}

                                            {/* Developer Reason Selection */}
                                            {showDevReason === story.id && user.role === 'Dev' && (
                                                <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                                    <h4 className="font-medium text-blue-900 mb-3">
                                                        Select the primary reason for this estimation:
                                                    </h4>
                                                    <div className="space-y-2 mb-4">
                                                        {devEstimationReasons.map((reason, index) => (
                                                            <label key={index} className="flex items-center">
                                                                <input
                                                                    type="radio"
                                                                    name={`devReason_${story.id}`}
                                                                    value={reason}
                                                                    checked={selectedDevReason === reason}
                                                                    onChange={(e) => setSelectedDevReason(e.target.value)}
                                                                    className="mr-2"
                                                                />
                                                                <span className="text-sm text-gray-700">{reason}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => confirmDevEstimation(story.id)}
                                                            disabled={!selectedDevReason}
                                                            className="px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
                                                        >
                                                            Confirm Estimation ({tempPoints} points)
                                                        </button>
                                                        <button
                                                            onClick={cancelDevEstimation}
                                                            className="px-3 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 text-sm"
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            )}

                                            {/* QA Reason Selection */}
                                            {showQaReason === story.id && user.role === 'QA' && (
                                                <div className="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                                                    <h4 className="font-medium text-green-900 mb-3">
                                                        Select the primary reason for this estimation:
                                                    </h4>
                                                    <div className="space-y-2 mb-4">
                                                        {qaEstimationReasons.map((reason, index) => (
                                                            <label key={index} className="flex items-center">
                                                                <input
                                                                    type="radio"
                                                                    name={`qaReason_${story.id}`}
                                                                    value={reason}
                                                                    checked={selectedQaReason === reason}
                                                                    onChange={(e) => setSelectedQaReason(e.target.value)}
                                                                    className="mr-2"
                                                                />
                                                                <span className="text-sm text-gray-700">{reason}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => confirmQaEstimation(story.id)}
                                                            disabled={!selectedQaReason}
                                                            className="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
                                                        >
                                                            Confirm Estimation ({tempPoints} points)
                                                        </button>
                                                        <button
                                                            onClick={cancelQaEstimation}
                                                            className="px-3 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 text-sm"
                                                        >
                                                            Cancel
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Estimation Summary */}
                                        {currentSession && (
                                            <div className="mt-6 p-4 bg-gray-50 rounded-lg">
                                                <h4 className="font-medium text-gray-900 mb-3">Estimation Summary</h4>
                                                {(() => {
                                                    const summary = getStoryEstimationSummary(story.id);
                                                    return (
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                            <div>
                                                                <p className="text-sm font-medium text-gray-700 mb-2">
                                                                    Estimated ({summary.estimated.length})
                                                                </p>
                                                                <div className="space-y-1">
                                                                    {summary.estimated.map(est => (
                                                                        <div key={est.userId} className="space-y-1">
                                                                            <div className="flex items-center gap-2">
                                                                                <span className={`px-2 py-1 rounded text-xs ${getRoleColor(est.role)}`}>
                                                                                    {est.name} ({est.role})
                                                                                </span>
                                                                                <span className="bg-gray-200 px-2 py-1 rounded text-xs font-mono">
                                                                                    {est.points}
                                                                                </span>
                                                                            </div>
                                                                            {est.devReason && est.role === 'Dev' && (
                                                                                <div className="ml-4 text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">
                                                                                    💡 {est.devReason}
                                                                                </div>
                                                                            )}
                                                                            {est.qaReason && est.role === 'QA' && (
                                                                                <div className="ml-4 text-xs text-green-600 bg-green-50 px-2 py-1 rounded">
                                                                                    🧪 {est.qaReason}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                    {summary.estimated.length === 0 && (
                                                                        <p className="text-sm text-gray-500">No estimations yet</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            
                                                            <div>
                                                                <p className="text-sm font-medium text-gray-700 mb-2">
                                                                    Pending ({summary.notEstimated.length})
                                                                </p>
                                                                <div className="space-y-1">
                                                                    {summary.notEstimated.map(pending => (
                                                                        <div key={pending.userId} className="flex items-center gap-2">
                                                                            <span className={`px-2 py-1 rounded text-xs ${getRoleColor(pending.role)} opacity-50`}>
                                                                                {pending.name} ({pending.role})
                                                                            </span>
                                                                            <span className="text-xs text-gray-500">Waiting...</span>
                                                                        </div>
                                                                    ))}
                                                                    {summary.notEstimated.length === 0 && (
                                                                        <p className="text-sm text-green-600">All users have estimated!</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })()}

                                                {/* PO Completion Controls */}
                                                {user.role === 'PO' && (
                                                    <div className="mt-4 pt-4 border-t border-gray-200">
                                                        <p className="text-sm font-medium text-gray-700 mb-2">Product Owner Actions</p>
                                                        <div className="flex gap-2">
                                                            {currentSession.completedStories && currentSession.completedStories[story.id] ? (
                                                                <button
                                                                    onClick={() => markStoryIncomplete(story.id)}
                                                                    className="px-3 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm"
                                                                >
                                                                    Mark as Incomplete
                                                                </button>
                                                            ) : (
                                                                <button
                                                                    onClick={() => markStoryComplete(story.id)}
                                                                    className="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm"
                                                                >
                                                                    Mark as Complete
                                                                </button>
                                                            )}
                                                        </div>
                                                        {currentSession.completedStories && currentSession.completedStories[story.id] && (
                                                            <p className="text-xs text-gray-500 mt-1">
                                                                Completed by {currentSession.completedStories[story.id].completedBy} on{' '}
                                                                {new Date(currentSession.completedStories[story.id].completedAt).toLocaleString()}
                                                            </p>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                    ))}

                                    {/* Completed Stories (collapsed view) */}
                                    {stories.filter(story => currentSession && currentSession.completedStories && currentSession.completedStories[story.id]).length > 0 && (
                                        <div className="mt-8">
                                            <h3 className="text-lg font-medium text-gray-900 mb-4">Completed Stories</h3>
                                            <div className="space-y-3">
                                                {stories.filter(story => currentSession && currentSession.completedStories && currentSession.completedStories[story.id]).map((story) => {
                                                    const averageEstimation = getStoryAverageEstimation(story.id);
                                                    return (
                                                        <div key={story.id} className="bg-green-50 p-4 rounded-lg shadow-sm border border-green-200">
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex items-center gap-3">
                                                                    {story.numberUrl ? (
                                                                        <a
                                                                            href={story.numberUrl}
                                                                            target="_blank"
                                                                            rel="noopener noreferrer"
                                                                            className="bg-green-100 text-green-800 px-3 py-2 rounded text-lg font-medium hover:bg-green-200 hover:text-green-900 transition-colors cursor-pointer"
                                                                            title={`Open ${story.numberUrl}`}
                                                                        >
                                                                            {story.number || 'N/A'}
                                                                            <svg className="inline-block ml-1 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                                                            </svg>
                                                                        </a>
                                                                    ) : (
                                                                        <span className="bg-green-100 text-green-800 px-3 py-2 rounded text-lg font-medium">
                                                                            {story.number || story.title?.split(' ')[0] || 'N/A'}
                                                                        </span>
                                                                    )}
                                                                    <span className="bg-green-100 text-green-800 px-2 py-1 rounded text-sm font-medium">
                                                                        ✓ Complete
                                                                    </span>
                                                                    {story.restrictions && story.restrictions.devOnly && (
                                                                        <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-medium">
                                                                            👨‍💻 Dev Only
                                                                        </span>
                                                                    )}
                                                                    {story.restrictions && story.restrictions.qaOnly && (
                                                                        <span className="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs font-medium">
                                                                            🧪 QA Only
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                
                                                                <div className="flex items-center gap-3">
                                                                    <div className="text-right">
                                                                        <p className="text-sm text-gray-600">Average Estimation</p>
                                                                        <p className="text-2xl font-bold text-green-700">{averageEstimation}</p>
                                                                    </div>
                                                                    
                                                                    {user.role === 'PO' && (
                                                                        <button
                                                                            onClick={() => markStoryIncomplete(story.id)}
                                                                            className="px-3 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm"
                                                                            title="Mark as Incomplete"
                                                                        >
                                                                            Reopen
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="text-center mt-12 text-gray-500 text-sm">
                            <p>Story points are saved automatically in your browser's local storage</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
